[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cotkit"
version = "0.1.0"
description = "Small, solid Cursor-on-Target (CoT) bridge library: framing, typed events, builders, reconnecting TAK clients, and an offline fake TAK server for tests."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Francesco Romano" }]
keywords = ["cot", "cursor-on-target", "tak", "atak", "takserver", "situational-awareness"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/tamu-edu/cotkit"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["cotkit"]

[tool.setuptools.package-data]
cotkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
